name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run eval -- --repetitions 3
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: .omo/evidence/evaluation/latest.json
          include-hidden-files: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:task-core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            .omo/evidence/playwright-report/
            .omo/evidence/task-core/scenario/
          include-hidden-files: true
          if-no-files-found: ignore
