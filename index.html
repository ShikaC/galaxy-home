<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="银河居所是一个本地优先的个人空间，用于捕捉想法、推进任务与温和回顾。"
    />
    <meta name="theme-color" content="#0a0c11" />
    <title>银河居所</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("galaxy:theme")
          const theme = stored === "dawn" || stored === "night" ? stored : "night"
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme === "dawn" ? "light" : "dark"
        } catch {
          document.documentElement.dataset.theme = "night"
        }
      })()
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #0a0c11;
      }

      html[data-theme="dawn"],
      html[data-theme="dawn"] body {
        background: #efe8dc;
      }

      #root {
        min-height: 100vh;
      }

      .boot-screen {
        display: grid;
        min-height: 100vh;
        place-items: center;
        color: #9aa3b4;
        font: 14px/1.5 "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      }

      html[data-theme="dawn"] .boot-screen {
        color: #5d665c;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div aria-live="polite" class="boot-screen" role="status">正在连接本地服务...</div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
